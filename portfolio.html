                        bg: 'bg-emerald-500/10', border: 'border-emerald-500/30', text: 'text-emerald-500', 
                        label: 'GAME', 
                        icon: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>'
                    };
                }
            } else if (cat === 'Web') {
                if (title.includes('landing') || desc.includes('лендинг')) {
                    style = { 
                        bg: 'bg-pink-500/10', border: 'border-pink-500/30', text: 'text-pink-500', 
                        label: 'LD', 
                        icon: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path></svg>'
                    };
                } else {
                    style = { 
                        bg: 'bg-blue-500/10', border: 'border-blue-500/30', text: 'text-blue-500', 
                        label: 'WEB', 
                        icon: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>'
                    };
                }
            } else if (cat === 'Mobile') {
                style = { 
                    bg: 'bg-cyan-500/10', border: 'border-cyan-500/30', text: 'text-cyan-500', 
                    label: 'APP', 
                    icon: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>'
                };
            } else if (cat === 'AI') {
                style = { 
                    bg: 'bg-purple-500/10', border: 'border-purple-500/30', text: 'text-purple-500', 
                    label: 'AI', 
                    icon: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>'
                };
            } else if (cat === 'PC') {
                style = { 
                    bg: 'bg-gray-500/10', border: 'border-gray-500/30', text: 'text-gray-400', 
                    label: 'PC', 
                    icon: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>'
                };
            }

            return style;
        }

        function renderProjects(filter = 'all') {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            projects.forEach(group => {
                // Filter items in this year
                const filteredItems = group.items.filter(item => filter === 'all' || item.category === filter);
                
                if (filteredItems.length > 0) {
                    // Year Header
                    const yearBlock = document.createElement('div');
                    yearBlock.className = 'relative border-l border-white/10 pl-8 pb-2';
                    yearBlock.innerHTML = `
                        <div class="absolute -left-3 top-0 w-6 h-6 bg-charcoal border border-electricBlue rounded-full flex items-center justify-center shadow-[0_0_10px_rgba(0,122,255,0.3)]">
                            <div class="w-2 h-2 bg-electricBlue rounded-full"></div>
                        </div>
                        <h2 class="text-2xl font-bold text-white mb-6 -mt-1 font-display">${group.year}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    `;

                    const itemsContainer = yearBlock.querySelector('.grid');

                    filteredItems.forEach((item, index) => {
                        const style = getProjectStyle(item);
                        const card = document.createElement('a');
                        card.className = 'glass-card p-3 rounded-xl flex gap-4 items-center hover:bg-white/5 group text-left opacity-0 animate-slide-in cursor-pointer transition-all hover:translate-x-1';
                        card.style.animationDelay = `${index * 50}ms`;
                        card.onclick = () => openModal(item);
                        card.innerHTML = `
                            <div class="w-20 h-14 sm:w-24 sm:h-16 rounded-lg overflow-hidden shrink-0 bg-gray-800">
                                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="flex items-center gap-1.5 text-[10px] font-bold ${style.text} uppercase tracking-wider border ${style.border} ${style.bg} px-2 py-1 rounded">
                                        ${style.icon}
                                        ${style.label}
                                    </span>
                                    <span class="text-xs text-gray-500">•</span>
                                    <span class="text-xs text-gray-400">${item.date}</span>
                                </div>
                                <h3 class="text-sm sm:text-base font-bold text-white truncate group-hover:text-electricBlue transition-colors">${item.title}</h3>
                                <p class="text-xs sm:text-sm text-gray-400 truncate">${item.desc}</p>
                            </div>
                            <div class="pr-2 opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 duration-300">
                                <svg class="w-5 h-5 text-electricBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        `;
                        itemsContainer.appendChild(card);
                    });

                    container.appendChild(yearBlock);
                }
            });
        }

        // Modal Logic
        let currentProjectImages = [];
        let currentImageIndex = 0;

        function openModal(item) {
            const modal = document.getElementById('projectModal');
            const style = getProjectStyle(item);
            
            // Set Content
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalDesc').textContent = item.desc;
            
            // Story
            const storySection = document.getElementById('modalStorySection');
            if (item.story) {
                document.getElementById('modalStory').textContent = item.story;
                storySection.style.display = 'block';
            } else {
                storySection.style.display = 'none';
            }

            const catBadge = document.getElementById('modalCategory');
            catBadge.textContent = style.label;
            catBadge.className = `text-xs font-bold px-2 py-1 rounded mb-2 inline-block ${style.bg} ${style.text} border ${style.border}`;

            // Tech
            const techContainer = document.getElementById('modalTech');
            techContainer.innerHTML = (item.tech || []).map(t => `<span class="tech-tag">${t}</span>`).join('');

            // Features
            const featuresContainer = document.getElementById('modalFeatures');
            featuresContainer.innerHTML = (item.features || []).map(f => `
                <div class="feature-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>${f}</span>
                </div>
            `).join('');

            // Gallery
            currentProjectImages = item.images || [item.image];
            currentImageIndex = 0;
            updateModalImage();

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('projectModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateModalImage() {
            document.getElementById('modalImage').src = currentProjectImages[currentImageIndex];
        }

        function nextImage() { currentImageIndex = (currentImageIndex + 1) % currentProjectImages.length; updateModalImage(); }
        function prevImage() { currentImageIndex = (currentImageIndex - 1 + currentProjectImages.length) % currentProjectImages.length; updateModalImage(); }

        function filterProjects(category) {
            const container = document.getElementById('timeline-container');
            
            container.style.transition = 'opacity 0.15s ease-out';
            container.style.opacity = '0';

            setTimeout(() => {
                // Update buttons
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    if (btn.textContent === (category === 'all' ? 'Все' : category)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                renderProjects(category);
                container.style.transition = 'opacity 0.3s ease-in';
                container.style.opacity = '1';
            }, 150);
        }

        // Init
        renderProjects();

        // Handle opening modal from URL
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectIdToOpen = urlParams.get('project');

            if (projectIdToOpen) {
                const allProjects = projects.flatMap(group => group.items);
                const projectData = allProjects.find(p => p.id === projectIdToOpen);
                if (projectData) {
                    // Use a small timeout to let the page render and animations finish
                    setTimeout(() => openModal(projectData), 100);
                }
            }
        });
    </script>
</body>
</html>
